[project]
name = "m365-local-ai"
version = "0.1.0"
description = "Conector Microsoft 365 (Graph API) + IA Local (LM Studio / Ollama) con Servidor MCP y Motor de Auto-Respuesta"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "msal>=1.28.0",
    "msal-extensions>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "beautifulsoup4>=4.12.3",
    "markdownify>=0.12.1",
    "markdown>=3.6",
    "mcp>=1.2.0",
    "openai>=1.30.0",
    "rich>=13.7.0",
]

[project.scripts]
m365-mcp = "src.mcp_server:main"
m365-daemon = "src.daemon:main"
